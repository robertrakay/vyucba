<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <style>
    /* Základné nastavenie tela stránky */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      /* Odsadenie pre obsah kvôli sidebaru - presne 250px ako je šírka sidebaru */
      padding-left: 250px;
      transition: padding-left 0.25s ease;
      background: #fafafa;
    }

    /* Ak je sidebar úplne vypnutý cez hlavičku */
    body.no-sidebar {
      padding-left: 0;
    }

    /* Ak operátor zavrie sidebar cez tlačidlo (JS pridá túto triedu) */
    body.sidebar-closed {
      padding-left: 0 !important;
    }

    #main-content {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* NOVÉ: Pomodoro timer container napravo od obsahu */
    #pomodoro-container {
      position: fixed;
      top: 100px; /* vzdialenosť od hornej časti okna */
      right: 20px; /* od pravého okraja */
      width: 250px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    /* Responzivita: Na malých obrazovkách zrušíme fixný padding pre sidebar a skryjeme Pomodoro */
    @media (max-width: 768px) {
      body {
        padding-left: 0 !important;
      }
      #pomodoro-container {
        display: none; /* Na mobile zaberá Pomodoro priveľa miesta */
      }
    }
  </style>
</head>

<body class="{% if page.show_sidebar == false %}no-sidebar{% endif %}">

  {% if page.show_sidebar != false %}
    <!-- BEGIN SIDEBAR -->
    {% include sidebar.html %}
  {% endif %}

  <!-- HLAVNÝ OBSAH PREDMETU -->
  <div id="main-content">
    {{ content }}
  </div>

  <!-- BEGIN POMODORO TIMER -->
  <div id="pomodoro-container">
    {% include pomodoro.html %}
  </div>
  <!-- END POMODORO TIMER -->

</body>
</html>
